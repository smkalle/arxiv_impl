[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "metaorch"
version = "0.1.0"
description = "Meta-orchestrator pipeline chaining all arxiv_impl subprojects' use cases end-to-end."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.111.0",
    "pydantic>=2.6",
    "uvicorn[standard]>=0.29.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]
ui = [
    "streamlit>=1.30",
    "requests>=2.31",
]

[project.scripts]
metaorch = "metaorch.api.main:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["metaorch*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"