[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sira-kb-ingestor"
version = "0.1.0"
description = "AAFLOW + SIRA integration package"
requires-python = ">=3.10"
dependencies = [
  "pyarrow>=15",
  "faiss-cpu>=1.8",
  "numpy>=1.26",
  "click>=8",
  "rich>=13",
  "fastapi>=0.110",
  "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "httpx>=0.27",
]

[project.scripts]
sira-ingest = "sira_kb_ingestor.cli:cli"

[tool.pytest.ini_options]
testpaths = ["tests"]
